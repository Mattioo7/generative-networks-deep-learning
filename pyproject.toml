[project]
name = "generative-networks-deep-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandas-stubs~=3.0.2",
    "pillow>=10.0",
    "scipy>=1.13",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.67",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
